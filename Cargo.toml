[workspace]
resolver = "2"
members = [
    "crates/aipow-types",
    "crates/aipow-classifier",
    "crates/aipow-score",
    "crates/aipow-commitment",
    "crates/aipow-indexer",
    "crates/aipow-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
repository = "https://github.com/tosnetwork/aipow-scorer"

[workspace.dependencies]
aipow-types = { path = "crates/aipow-types" }
aipow-classifier = { path = "crates/aipow-classifier" }
aipow-score = { path = "crates/aipow-score" }
aipow-commitment = { path = "crates/aipow-commitment" }
aipow-indexer = { path = "crates/aipow-indexer" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
arithmetic_side_effects = "deny"
indexing_slicing = "deny"
