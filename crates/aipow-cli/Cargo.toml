[package]
name = "aipow-cli"
version.workspace = true
edition.workspace = true
repository.workspace = true
description = "Run the AIPoW scoring pipeline over a fixture and print the epoch score root"

[[bin]]
name = "aipow-scorer"
path = "src/main.rs"

[dependencies]
aipow-types = { workspace = true }
aipow-classifier = { workspace = true }
aipow-score = { workspace = true }
aipow-commitment = { workspace = true }
aipow-indexer = { workspace = true }
ed25519-dalek = "2"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
